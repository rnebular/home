services:
  mc:
    image: itzg/minecraft-server:latest
    environment:
      EULA: true
      MEMORY: 4G

      OPS: |
        RNebular
        NotRealWolfOG

      TYPE: FABRIC
      VERSION: "1.21.1"
      MODRINTH_PROJECTS: fabric-api,disabilities
    volumes:
      - mc:/data
    ports:
      - "25565:25565"

volumes:
  mc: {}

