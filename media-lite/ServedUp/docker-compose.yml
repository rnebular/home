services:
  movie-site:
    image: nginx:alpine
    container_name: movie-site
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.movie-site.rule=Host(`movies.8dot3.net`)"   # <-- change to your domain
      - "traefik.http.routers.movie-site.entrypoints=websecure"
      - "traefik.http.routers.movie-site.tls.certresolver=letsencrypt"
      - "traefik.http.services.movie-site.loadbalancer.server.port=80"
  
networks:
  proxy:
    external: true