api:
  dashboard: true
  # insecure: true   # uncomment only temporarily for local testing; remove for production

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: jtbyrum@gmail.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO